packages:
  - .

autoInstallPeers: true
linkWorkspacePackages: true

allowBuilds:
  core-js: false
  "@parcel/watcher": true
  esbuild: true
  sharp: true

# Supply-chain protection on top of the pnpm 11 defaults (24h release age, no exotic subdependencies).
# Enforce the release age, and reject releases from the last 7 days that lost publish trust.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
minimumReleaseAgeStrict: true
