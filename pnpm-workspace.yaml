# No dependency runs install scripts, here, in CI or on Netlify. esbuild and sharp
# ship prebuilt binaries as optional dependencies.
allowBuilds:
  core-js: false
  esbuild: false
  sharp: false

overrides:
  # favilib 1.0.5 (via astro-favicons) pins sharp ^0.33.5, which is vulnerable
  # below 0.35.4. It only uses resize and metadata, which work the same in 0.35.
  "favilib>sharp": ^0.35.5

# Supply-chain protection on top of the pnpm defaults (24h release age, no exotic subdependencies).
# When only a release under a day old fits, ask (fail in CI) instead of installing it anyway.
minimumReleaseAgeStrict: true
# Allow the exact checker release that ships with the template.
minimumReleaseAgeExclude:
  - "@fulldotdev/check@0.4.0"
# Reject a release published with weaker trust (provenance) than earlier versions.
# Only releases from the last 7 days are checked, so older ones in existing lockfiles still install.
trustPolicy: no-downgrade
# Our web-authenticated release omits npm's approver metadata. Its registry
# integrity matches the locally tested tarball; allow only that exact release.
trustPolicyExclude:
  - "@fulldotdev/check@0.4.0"
trustPolicyIgnoreAfter: 10080
# Never run .pnpmfile hooks.
ignorePnpmfile: true
# Never run lifecycle scripts, including this project's own. allowBuilds only covers dependencies.
ignoreScripts: true
