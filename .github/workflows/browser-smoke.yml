# The browser smoke in Chromium against a deployment, on request. See
# tests/browser/README.md.
name: Browser smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Address of the deployment, such as a Deploy Preview
        required: true

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      - run: pnpm test:browser
        env:
          BASE_URL: ${{ inputs.base_url }}
          BROWSER_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: .dev/browser/
          include-hidden-files: true
          retention-days: 7
