name: Ready

on:
  pull_request_target:
    branches: [main]
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        labeled,
        unlabeled,
      ]
  workflow_run:
    workflows: [Check]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: write
  checks: read

jobs:
  ready:
    uses: fulldotdev/.github/.github/workflows/ready.yml@f2895c09a7d688a58f2bacc200c7b18bc07574e7
    with:
      runner: blacksmith-2vcpu-ubuntu-2404
      netlify-checks: '["netlify/silveltman/deploy-preview"]'
